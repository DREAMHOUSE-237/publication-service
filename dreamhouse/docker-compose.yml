services:
  mysql:
    image: mysql:8.0
    container_name: mysql_publication
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd123
      MYSQL_DATABASE: publication_db
      MYSQL_USER: publication_user
      MYSQL_PASSWORD: kwandji124
    ports:
      - "3308:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_publication
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3307
      PMA_USER: publication_user
      PMA_PASSWORD: kwandji124
    ports:
      - "8280:80"
